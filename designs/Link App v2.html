<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link — Video Conferencing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0a0c14; }
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    input::placeholder { color: rgba(255,255,255,0.22); }
    input, select, button, textarea { font-family: 'Inter', sans-serif; }
    select option { background: #1a1f2e; color: white; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseRing {
      0%   { transform: scale(0.88); opacity: 0.75; }
      70%  { transform: scale(1.5);  opacity: 0; }
      100% { transform: scale(1.5);  opacity: 0; }
    }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0);  opacity: 0.3; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes speakPulse {
      0%   { box-shadow: 0 0 0 0   rgba(59,130,246,0.65); }
      70%  { box-shadow: 0 0 0 10px rgba(59,130,246,0);   }
      100% { box-shadow: 0 0 0 0   rgba(59,130,246,0);    }
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .screen-enter   { animation: fadeUp   0.32s cubic-bezier(0.22,1,0.36,1) both; }
    .speaking-tile  { animation: speakPulse 1.6s ease-out infinite; }
    .toast-enter    { animation: toastIn  0.25s ease both; }
    .logo-float     { animation: logoFloat 4s ease-in-out infinite; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="link-join.jsx"></script>
  <script type="text/babel" src="link-landing.jsx"></script>
  <script type="text/babel" src="link-room-v2.jsx"></script>
  <script type="text/babel" src="link-profile.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { TweaksPanel, TweakSection, TweakSlider, TweakToggle, TweakColor, TweakRadio, useTweaks } = window;
    const { LandingPage, AuthScreen } = window;
    const { JoinScreen, LinkLogoMark } = window;
    const { RoomScreen } = window;
    const { ProfilePage } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "participantCount": 4,
      "forceMobile": false,
      "accentColor": "#3B82F6",
      "startScreen": "landing"
    }/*EDITMODE-END*/;

    // Persist user across sessions
    const savedUser = (() => { try { return JSON.parse(localStorage.getItem('link_user')); } catch(e){ return null; } })();

    /* ── Connecting splash ──────────────────────────────────── */
    function DotsLoader() {
      return (
        <div style={{ display:'flex', gap:6, marginTop:20 }}>
          {[0,1,2].map(i => (
            <span key={i} style={{ width:7, height:7, borderRadius:'50%', background:'#3B82F6', display:'block', animation:`dotBounce 1.2s ease-in-out ${i*0.16}s infinite` }}/>
          ))}
        </div>
      );
    }

    function ConnectingSplash({ name, accent, onDone }) {
      useEffect(() => { const t = setTimeout(onDone, 1900); return () => clearTimeout(t); }, []);
      const ini = name.split(' ').filter(Boolean).map(n=>n[0]).join('').toUpperCase().slice(0,2) || '?';
      return (
        <div style={{ width:'100%', height:'100%', background:'#0a0c14', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', fontFamily:'Inter,sans-serif' }}>
          <div style={{ position:'relative', marginBottom:28 }}>
            <div style={{ position:'absolute', inset:-20, borderRadius:'50%', border:`2px solid ${accent}40`, animation:'pulseRing 1.4s ease-out infinite' }}/>
            <div style={{ width:72, height:72, borderRadius:'50%', background:`linear-gradient(135deg,${accent}cc,${accent}66)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:26, fontWeight:700, color:'white', position:'relative', zIndex:1 }}>{ini}</div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:9, marginBottom:8 }}>
            <LinkLogoMark size={24}/>
            <span style={{ color:'white', fontSize:18, fontWeight:700, letterSpacing:'-0.02em' }}>Link</span>
          </div>
          <span style={{ color:'rgba(255,255,255,0.4)', fontSize:13 }}>Joining room…</span>
          <DotsLoader/>
        </div>
      );
    }

    /* ── Mobile frame wrapper ───────────────────────────────── */
    function MobileFrame({ children }) {
      return (
        <div style={{ width:'100vw', height:'100vh', background:'#070810', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <div style={{ width:390, height:844, borderRadius:44, overflow:'hidden', position:'relative', boxShadow:'0 0 0 10px #1a1f2e, 0 0 0 11px rgba(255,255,255,0.07), 0 40px 100px rgba(0,0,0,0.7)', flexShrink:0 }}>
            {/* Notch */}
            <div style={{ position:'absolute', top:0, left:'50%', transform:'translateX(-50%)', width:126, height:34, background:'#1a1f2e', borderRadius:'0 0 20px 20px', zIndex:9999, pointerEvents:'none' }}/>
            <div style={{ width:'100%', height:'100%', overflow:'hidden', position:'relative' }}>
              {children}
            </div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      // screen: 'landing' | 'auth' | 'join' | 'connecting' | 'room'
      const [screen, setScreen] = useState(tweaks.startScreen || 'landing');
      const [user,     setUser    ] = useState(savedUser);
      const [userName,  setUserName] = useState(savedUser?.name || '');
      const [prevScreen,setPrevScreen] = useState('room');

      const { participantCount, forceMobile, accentColor } = tweaks;

      const handleStartMeeting = () => setScreen('auth');
      const handleJoinCode     = () => setScreen('auth');
      const handleAuth         = u  => { const updated = {...u}; setUser(updated); localStorage.setItem('link_user', JSON.stringify(updated)); setScreen('join'); };
      const handleJoin         = name => { setUserName(name); setScreen('connecting'); };
      const handleConnected    = () => setScreen('room');
      const handleLeave        = () => setScreen('join');
      const handleOpenProfile  = () => { setPrevScreen(screen); setScreen('profile'); };
      const handleSaveProfile  = u  => { setUser(u); setUserName(u.name); localStorage.setItem('link_user', JSON.stringify(u)); };
      const handleProfileBack  = () => setScreen(prevScreen === 'profile' ? 'room' : prevScreen);

      const wrap = el => forceMobile ? <MobileFrame>{el}</MobileFrame> : el;

      return (
        <>
          {screen === 'landing'    && wrap(<div className="screen-enter" style={{height:'100%'}}><LandingPage onStartMeeting={handleStartMeeting} onJoinWithCode={handleJoinCode}/></div>)}
          {screen === 'auth'       && wrap(<div className="screen-enter" style={{height:'100%'}}><AuthScreen onAuth={handleAuth}/></div>)}
          {screen === 'join'       && wrap(<div className="screen-enter" style={{height:'100%'}}><JoinScreen onJoin={handleJoin} roomId="room-k9p2m" user={user}/></div>)}
          {screen === 'connecting' && wrap(<ConnectingSplash name={userName} accent={accentColor} onDone={handleConnected}/>)}
          {screen === 'room'       && wrap(<div className="screen-enter" style={{height:'100%'}}><RoomScreen userName={userName} userPhoto={user?.photo||null} onLeave={handleLeave} onProfile={handleOpenProfile} participantCount={participantCount} isMobile={forceMobile} accent={accentColor}/></div>)}
          {screen === 'profile'    && wrap(<div className="screen-enter" style={{height:'100%'}}><ProfilePage user={user} onSave={handleSaveProfile} onBack={handleProfileBack} accent={accentColor}/></div>)}

          <TweaksPanel>
            <TweakSection title="Navigate">
              <TweakRadio
                label="Start at"
                value={tweaks.startScreen}
                options={[{label:'Landing',value:'landing'},{label:'Auth',value:'auth'},{label:'Room',value:'room'}]}
                onChange={v=>{ setTweak('startScreen',v); setScreen(v); }}
              />
            </TweakSection>
            <TweakSection title="Room">
              <TweakSlider label="Participants" value={participantCount} min={1} max={6} step={1} onChange={v=>setTweak('participantCount',v)}/>
              <TweakToggle label="Mobile frame" value={forceMobile} onChange={v=>setTweak('forceMobile',v)}/>
            </TweakSection>
            <TweakSection title="Brand">
              <TweakColor label="Accent" value={accentColor} options={['#3B82F6','#8B5CF6','#06B6D4']} onChange={v=>setTweak('accentColor',v)}/>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
