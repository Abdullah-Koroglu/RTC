<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0a0c14"/>
  <!-- Connection nodes -->
  <circle cx="8" cy="8" r="2.5" fill="#3B82F6"/>
  <circle cx="24" cy="8" r="2.5" fill="#3B82F6"/>
  <circle cx="8" cy="24" r="2.5" fill="#3B82F6"/>
  <circle cx="24" cy="24" r="2.5" fill="#60A5FA"/>
  <!-- Connecting lines -->
  <line x1="8" y1="8" x2="24" y2="8" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="8" y1="8" x2="8" y2="24" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="8" y1="24" x2="24" y2="24" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="24" y1="8" x2="24" y2="24" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Diagonal accent -->
  <line x1="8" y1="8" x2="24" y2="24" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="3" fill="#3B82F6"/>
</svg>
