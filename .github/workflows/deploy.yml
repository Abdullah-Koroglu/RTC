name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  # Images will be ghcr.io/<owner>/rtc-<service>:latest
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build all images in parallel ────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to GHCR

    strategy:
      fail-fast: false         # don't cancel sibling builds on failure
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.link.akoroglu.com.tr
              NEXT_PUBLIC_SIGNALING_URL=wss://signal.link.akoroglu.com.tr/ws
              NEXT_PUBLIC_MEDIASOUP_URL=https://media.link.akoroglu.com.tr

          - service: api
            dockerfile: services/api/Dockerfile

          - service: mediasoup
            dockerfile: services/mediasoup/Dockerfile

          - service: signaling
            dockerfile: services/signaling/Dockerfile

          - service: coturn
            dockerfile: infra/coturn/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rtc-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/rtc-${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build_args || '' }}
          # Layer cache per service — dramatically speeds up unchanged services
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Deploy to VPS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/rtc

            # Pull latest code (for compose files, nginx config, etc.)
            git pull --ff-only

            # Pull new images — no building on the VPS
            GHCR_PREFIX=ghcr.io/${{ github.repository_owner }} \
              docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file .env.prod \
              pull

            # Restart with new images
            GHCR_PREFIX=ghcr.io/${{ github.repository_owner }} \
              docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file .env.prod \
              up -d --no-build

            # Clean up old dangling images to free disk
            docker image prune -f
