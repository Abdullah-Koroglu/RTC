version: '3.9'

name: rtc-prod

networks:
  rtc_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  mediasoup:
    build:
      context: ../../
      dockerfile: services/mediasoup/Dockerfile
    image: rtc-mediasoup:prod
    container_name: rtc-mediasoup-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: 4020
      MEDIASOUP_WORKER_COUNT: ${MEDIASOUP_WORKER_COUNT:-2}
      MEDIASOUP_WORKER_RTC_MIN_PORT: ${MEDIASOUP_WORKER_RTC_MIN_PORT:-40000}
      MEDIASOUP_WORKER_RTC_MAX_PORT: ${MEDIASOUP_WORKER_RTC_MAX_PORT:-40500}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_ENABLE_UDP: 'true'
      MEDIASOUP_ENABLE_TCP: 'true'
      MEDIASOUP_PREFER_UDP: 'true'
      MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE: 1000000
      MEDIASOUP_MAX_INCOMING_BITRATE: 1500000
      MEDIASOUP_LOG_TAGS: ice,dtls,rtp,rtcp
    ports:
      - '127.0.0.1:4020:4020' # HTTP API — Nginx only
      - '40000-40500:40000-40500/udp' # RTP/DTLS media — direct
      - '40000-40500:40000-40500/tcp'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4020/health\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 4s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - rtc_net

  coturn:
    build:
      context: ../../
      dockerfile: infra/coturn/Dockerfile
    image: rtc-coturn:prod
    container_name: rtc-coturn-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/turnserver
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_REALM: link.akoroglu.com.tr
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_EXTERNAL_IP: ${MEDIASOUP_ANNOUNCED_IP}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT:-49160}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT:-49170}
      TURN_TLS_CERT_PATH: /etc/coturn/tls/tls.crt
      TURN_TLS_KEY_PATH: /etc/coturn/tls/tls.key
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49170:49160-49170/udp"
    volumes:
      - ../../infra/coturn/tls:/etc/coturn/tls:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 3478']
      interval: 20s
      timeout: 3s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - rtc_net

  postgres:
    image: postgres:16-alpine
    container_name: rtc-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rtc_net

  redis:
    image: redis:7-alpine
    container_name: rtc-redis-prod
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - rtc_net

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    image: rtc-api:prod
    container_name: rtc-api-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://link.akoroglu.com.tr
      TURN_REALM: link.akoroglu.com.tr
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rtc_net

  signaling:
    build:
      context: ../../
      dockerfile: services/signaling/Dockerfile
    image: rtc-signaling:prod
    container_name: rtc-signaling-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 4010
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: https://link.akoroglu.com.tr
    ports:
      - '127.0.0.1:4010:4010'
    depends_on:
      redis:
        condition: service_healthy
      mediasoup:
        condition: service_started
    networks:
      - rtc_net

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
      # They MUST be passed as build args, not just environment vars.
      args:
        NEXT_PUBLIC_API_URL: https://api.link.akoroglu.com.tr
        NEXT_PUBLIC_SIGNALING_URL: wss://signal.link.akoroglu.com.tr/ws
        NEXT_PUBLIC_MEDIASOUP_URL: https://media.link.akoroglu.com.tr
    image: rtc-web:prod
    container_name: rtc-web-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_started
      signaling:
        condition: service_started
    networks:
      - rtc_net
