version: '3.9'

name: rtc-local

x-common-env: &common-env
  NODE_ENV: development

networks:
  rtc_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  mediasoup:
    build:
      context: ../../
      dockerfile: services/mediasoup/Dockerfile
    image: rtc-mediasoup:local
    container_name: rtc-mediasoup-local
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: 4020
      MEDIASOUP_WORKER_COUNT: ${MEDIASOUP_WORKER_COUNT:-2}
      MEDIASOUP_WORKER_RTC_MIN_PORT: ${MEDIASOUP_WORKER_RTC_MIN_PORT:-40000}
      MEDIASOUP_WORKER_RTC_MAX_PORT: ${MEDIASOUP_WORKER_RTC_MAX_PORT:-49999}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_ENABLE_UDP: ${MEDIASOUP_ENABLE_UDP:-true}
      MEDIASOUP_ENABLE_TCP: ${MEDIASOUP_ENABLE_TCP:-true}
      MEDIASOUP_PREFER_UDP: ${MEDIASOUP_PREFER_UDP:-true}
      MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE: ${MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE:-1000000}
      MEDIASOUP_MAX_INCOMING_BITRATE: ${MEDIASOUP_MAX_INCOMING_BITRATE:-1500000}
      MEDIASOUP_LOG_TAGS: ${MEDIASOUP_LOG_TAGS:-ice,dtls,rtp,rtcp,bwe,score,simulcast,svc}
      MEDIASOUP_CODECS_JSON: ${MEDIASOUP_CODECS_JSON}
    ports:
      - '4020:4020'
      - '${MEDIASOUP_WORKER_RTC_MIN_PORT:-40000}-${MEDIASOUP_WORKER_RTC_MAX_PORT:-49999}:${MEDIASOUP_WORKER_RTC_MIN_PORT:-40000}-${MEDIASOUP_WORKER_RTC_MAX_PORT:-49999}/udp'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4020/health || exit 1']
      interval: 20s
      timeout: 4s
      retries: 5
    networks:
      - rtc_net

  coturn:
    build:
      context: ../../
      dockerfile: infra/coturn/Dockerfile
    image: rtc-coturn:local
    container_name: rtc-coturn-local
    restart: unless-stopped
    environment:
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_REALM: ${TURN_REALM:-turn.local.rtc}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-change-me}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT:-49160}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT:-49170}
      TURN_TLS_CERT_PATH: ${TURN_TLS_CERT_PATH:-/etc/coturn/tls/tls.crt}
      TURN_TLS_KEY_PATH: ${TURN_TLS_KEY_PATH:-/etc/coturn/tls/tls.key}
    ports:
      - '${TURN_PORT:-3478}:3478/tcp'
      - '${TURN_PORT:-3478}:3478/udp'
      - '${TURN_TLS_PORT:-5349}:5349/tcp'
      - '${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49170}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49170}/udp'
    volumes:
      - ../../infra/coturn/tls:/etc/coturn/tls:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 3478']
      interval: 20s
      timeout: 3s
      retries: 5
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - rtc_net

  postgres:
    image: postgres:16-alpine
    container_name: rtc-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtc}
      POSTGRES_USER: ${POSTGRES_USER:-rtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtc_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rtc} -d ${POSTGRES_DB:-rtc}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rtc_net

  redis:
    image: redis:7-alpine
    container_name: rtc-redis-local
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - rtc_net

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    image: rtc-api:local
    container_name: rtc-api-local
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: 4000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtc}:${POSTGRES_PASSWORD:-rtc_password}@postgres:5432/${POSTGRES_DB:-rtc}
    ports:
      - '4000:4000'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rtc_net

  signaling:
    build:
      context: ../../
      dockerfile: services/signaling/Dockerfile
    image: rtc-signaling:local
    container_name: rtc-signaling-local
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: 4010
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - '4010:4010'
    depends_on:
      redis:
        condition: service_healthy
      mediasoup:
        condition: service_started
    networks:
      - rtc_net

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    image: rtc-web:local
    container_name: rtc-web-local
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SIGNALING_URL: ${NEXT_PUBLIC_SIGNALING_URL:-ws://localhost:4010/ws}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started
      signaling:
        condition: service_started
    networks:
      - rtc_net
