version: '3.9'

services:
  mediasoup:
    build:
      context: ../../
      dockerfile: services/mediasoup/Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: 4020
      MEDIASOUP_WORKER_COUNT: ${MEDIASOUP_WORKER_COUNT:-2}
      MEDIASOUP_WORKER_RTC_MIN_PORT: 40000
      MEDIASOUP_WORKER_RTC_MAX_PORT: 40100
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
      MEDIASOUP_ENABLE_UDP: ${MEDIASOUP_ENABLE_UDP:-true}
      MEDIASOUP_ENABLE_TCP: ${MEDIASOUP_ENABLE_TCP:-true}
      MEDIASOUP_PREFER_UDP: ${MEDIASOUP_PREFER_UDP:-true}
      MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE: ${MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE:-1000000}
      MEDIASOUP_MAX_INCOMING_BITRATE: ${MEDIASOUP_MAX_INCOMING_BITRATE:-1500000}
      MEDIASOUP_LOG_TAGS: ${MEDIASOUP_LOG_TAGS:-ice,dtls,rtp,rtcp,bwe,score,simulcast,svc}
      MEDIASOUP_CODECS_JSON: ${MEDIASOUP_CODECS_JSON}
      CORS_ORIGIN: http://localhost:3009
      SIGNALING_INTERNAL_URL: http://signaling:4010
    ports:
      - '4020:4020'
      - '40000-40500:40000-40500/udp'
      - '40000-40500:40000-40500/tcp'

  coturn:
    build:
      context: ../../
      dockerfile: infra/coturn/Dockerfile
    environment:
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_REALM: ${TURN_REALM:-localhost}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-rtc-local-turn-secret}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT:-49160}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT:-49170}
      TURN_TLS_CERT_PATH: ${TURN_TLS_CERT_PATH:-/etc/coturn/tls/tls.crt}
      TURN_TLS_KEY_PATH: ${TURN_TLS_KEY_PATH:-/etc/coturn/tls/tls.key}
    ports:
      - '${TURN_PORT:-3478}:3478/tcp'
      - '${TURN_PORT:-3478}:3478/udp'
      - '${TURN_TLS_PORT:-5349}:5349/tcp'
      - '${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49170}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49170}/udp'
    volumes:
      - ../../infra/coturn/tls:/etc/coturn/tls:ro

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SIGNALING_URL: ws://localhost:4010/ws
        NEXT_PUBLIC_MEDIASOUP_URL: http://localhost:4020
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SIGNALING_URL: ws://localhost:4010/ws
      NEXT_PUBLIC_MEDIASOUP_URL: http://localhost:4020
      NEXTAUTH_URL: http://localhost:3009
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_nextauth_secret_change_me_32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - '3009:3000'
    depends_on:
      - api
      - signaling

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    env_file:
      - ../../services/api/.env.example
    environment:
      JWT_SECRET: dev_jwt_secret_change_me_1234567890
      CORS_ORIGIN: http://localhost:3009
      TURN_REALM: localhost
      TURN_SHARED_SECRET: rtc-local-turn-secret
    ports:
      - '4000:4000'
    depends_on:
      - redis

  signaling:
    build:
      context: ../../
      dockerfile: services/signaling/Dockerfile
    env_file:
      - ../../services/signaling/.env.example
    environment:
      JWT_SECRET: dev_jwt_secret_change_me_1234567890
      ALLOWED_ORIGINS: http://localhost:3009
    ports:
      - '4010:4010'
    depends_on:
      - redis
      - coturn
      - mediasoup

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
