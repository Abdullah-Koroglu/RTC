apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rtc-apps
  labels:
    app: api
    app.kubernetes.io/part-of: rtc-platform
spec:
  replicas: 4
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: /health
      labels:
        app: api
        app.kubernetes.io/part-of: rtc-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/rtc-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: NODE_ENV
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: API_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: API_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: CORS_ORIGIN
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_REALM
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: rtc-turn-secret
                  key: TURN_SHARED_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rtc-app-secret
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rtc-app-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 8
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ['ALL']
