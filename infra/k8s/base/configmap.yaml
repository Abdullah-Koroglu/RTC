apiVersion: v1
kind: ConfigMap
metadata:
  name: rtc-app-config
  namespace: rtc-apps
  labels:
    app.kubernetes.io/part-of: rtc-platform
data:
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: '4000'
  SIGNALING_HOST: 0.0.0.0
  SIGNALING_PORT: '4010'
  WEB_PORT: '3000'
  NEXT_PUBLIC_API_URL: https://api.example.com
  NEXT_PUBLIC_SIGNALING_URL: wss://signal.example.com/ws
  CORS_ORIGIN: https://app.example.com
  ALLOWED_ORIGINS: https://app.example.com
