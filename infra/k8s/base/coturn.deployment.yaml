apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: rtc-apps
  labels:
    app: coturn
    app.kubernetes.io/part-of: rtc-platform
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
        app.kubernetes.io/part-of: rtc-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: ghcr.io/your-org/rtc-coturn:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turns-tcp
              containerPort: 5349
              protocol: TCP
          env:
            - name: TURN_PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_PORT
            - name: TURN_TLS_PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_TLS_PORT
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_REALM
            - name: TURN_EXTERNAL_IP
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_EXTERNAL_IP
            - name: TURN_RELAY_MIN_PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_RELAY_MIN_PORT
            - name: TURN_RELAY_MAX_PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_RELAY_MAX_PORT
            - name: TURN_TLS_CERT_PATH
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_TLS_CERT_PATH
            - name: TURN_TLS_KEY_PATH
              valueFrom:
                configMapKeyRef:
                  name: rtc-turn-config
                  key: TURN_TLS_KEY_PATH
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: rtc-turn-secret
                  key: TURN_SHARED_SECRET
          volumeMounts:
            - name: coturn-config
              mountPath: /etc/coturn/coturn.conf
              subPath: coturn.conf
              readOnly: true
            - name: coturn-tls
              mountPath: /etc/coturn/tls
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
              add: ['NET_BIND_SERVICE']
      volumes:
        - name: coturn-config
          configMap:
            name: rtc-turn-config
            items:
              - key: coturn.conf
                path: coturn.conf
        - name: coturn-tls
          secret:
            secretName: rtc-turn-tls
