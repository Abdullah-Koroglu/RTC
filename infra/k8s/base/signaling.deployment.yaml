apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: rtc-apps
  labels:
    app: signaling
    app.kubernetes.io/part-of: rtc-platform
spec:
  replicas: 6
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: signaling
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4010'
        prometheus.io/path: /
      labels:
        app: signaling
        app.kubernetes.io/part-of: rtc-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signaling
          image: ghcr.io/your-org/rtc-signaling:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4010
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: NODE_ENV
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: SIGNALING_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: SIGNALING_PORT
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: ALLOWED_ORIGINS
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rtc-app-secret
                  key: REDIS_URL
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 8
            periodSeconds: 8
            timeoutSeconds: 2
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ['ALL']
