apiVersion: v1
kind: ConfigMap
metadata:
  name: rtc-mediasoup-config
  namespace: rtc-apps
  labels:
    app.kubernetes.io/part-of: rtc-platform
data:
  HOST: 0.0.0.0
  PORT: '4020'
  MEDIASOUP_WORKER_COUNT: '1'
  MEDIASOUP_WORKER_RTC_MIN_PORT: '40000'
  MEDIASOUP_WORKER_RTC_MAX_PORT: '40020'
  MEDIASOUP_LISTEN_IP: 0.0.0.0
  MEDIASOUP_ANNOUNCED_IP: 203.0.113.20
  MEDIASOUP_ENABLE_UDP: 'true'
  MEDIASOUP_ENABLE_TCP: 'true'
  MEDIASOUP_PREFER_UDP: 'true'
  MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE: '1000000'
  MEDIASOUP_MAX_INCOMING_BITRATE: '1500000'
  MEDIASOUP_LOG_TAGS: ice,dtls,rtp,rtcp,bwe,score,simulcast,svc
  MEDIASOUP_CODECS_JSON: >-
    [{"kind":"audio","mimeType":"audio/opus","clockRate":48000,"channels":2},{"kind":"video","mimeType":"video/VP8","clockRate":90000,"parameters":{"x-google-start-bitrate":1000}}]
