apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: rtc-ingress
      namespace: rtc-apps
    patch: |-
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: remove
        path: /spec/tls
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1cors-allow-origin
        value: "http://app.local.rtc, https://app.local.rtc, http://localhost:3000"
      - op: replace
        path: /spec/rules/0/host
        value: app.local.rtc
      - op: replace
        path: /spec/rules/1/host
        value: api.local.rtc
      - op: replace
        path: /spec/rules/2/host
        value: signal.local.rtc
      - op: replace
        path: /spec/rules/3/host
        value: mediasoup.local.rtc
  - target:
      kind: ConfigMap
      name: rtc-app-config
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: development
      - op: replace
        path: /data/NEXT_PUBLIC_API_URL
        value: http://api.local.rtc
      - op: replace
        path: /data/NEXT_PUBLIC_SIGNALING_URL
        value: ws://signal.local.rtc/ws
      - op: replace
        path: /data/CORS_ORIGIN
        value: http://app.local.rtc
      - op: replace
        path: /data/ALLOWED_ORIGINS
        value: http://app.local.rtc
  - target:
      kind: ConfigMap
      name: rtc-turn-config
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /data/TURN_REALM
        value: turn.local.rtc
      - op: replace
        path: /data/TURN_EXTERNAL_IP
        value: 172.16.17.185
  - target:
      kind: ConfigMap
      name: rtc-mediasoup-config
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /data/MEDIASOUP_ANNOUNCED_IP
        value: 172.16.17.185
      - op: replace
        path: /data/MEDIASOUP_ENABLE_UDP
        value: 'false'
      - op: replace
        path: /data/MEDIASOUP_ENABLE_TCP
        value: 'true'
      - op: replace
        path: /data/MEDIASOUP_PREFER_UDP
        value: 'false'
      - op: replace
        path: /data/MEDIASOUP_WORKER_COUNT
        value: '1'
  - target:
      kind: Deployment
      name: web
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: signaling
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mediasoup
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: coturn
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: web-hpa
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: signaling-hpa
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: mediasoup-hpa
      namespace: rtc-apps
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
images:
  - name: ghcr.io/your-org/rtc-web
    newName: localhost:5111/rtc-web
    newTag: local-fix2
  - name: ghcr.io/your-org/rtc-api
    newName: localhost:5111/rtc-api
    newTag: local-fix1
  - name: ghcr.io/your-org/rtc-signaling
    newName: localhost:5111/rtc-signaling
    newTag: local
  - name: ghcr.io/your-org/rtc-mediasoup
    newName: localhost:5111/rtc-mediasoup
    newTag: local-fix4
  - name: ghcr.io/your-org/rtc-coturn
    newName: localhost:5111/rtc-coturn
    newTag: local
