# Coturn production configuration template.
# Values are rendered from environment variables at container startup.

# Core listeners
listening-ip=0.0.0.0
listening-port=${TURN_PORT}
tls-listening-port=${TURN_TLS_PORT}

# Auth and security
realm=${TURN_REALM}
use-auth-secret
static-auth-secret=${TURN_SHARED_SECRET}
stale-nonce
fingerprint

# TLS hardening
cert=${TURN_TLS_CERT_PATH}
pkey=${TURN_TLS_KEY_PATH}
no-tlsv1
no-tlsv1_1
cipher-list=ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# Relay and NAT behavior
external-ip=${TURN_EXTERNAL_IP}
min-port=${TURN_RELAY_MIN_PORT}
max-port=${TURN_RELAY_MAX_PORT}
no-multicast-peers
no-loopback-peers

# Quotas and abuse protection
user-quota=12
total-quota=240
bps-capacity=0

# Operational defaults
no-cli
proc-user=turnserver
proc-group=turnserver
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
verbose
