# /etc/nginx/sites-available/rtc
# Symlink: ln -s /etc/nginx/sites-available/rtc /etc/nginx/sites-enabled/rtc
#
# Replace DOMAIN with your base domain (e.g. link.akoroglu.com.tr)
# SSL certs are issued by Certbot; paths follow the Let's Encrypt convention.

# ── Redirect all HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    server_name link.akoroglu.com.tr api.link.akoroglu.com.tr signal.link.akoroglu.com.tr media.link.akoroglu.com.tr;
    return 301 https://$host$request_uri;
}

# ── Web app ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name link.akoroglu.com.tr;

    ssl_certificate     /etc/letsencrypt/live/link.akoroglu.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.akoroglu.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.link.akoroglu.com.tr;

    ssl_certificate     /etc/letsencrypt/live/link.akoroglu.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.akoroglu.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Signaling (WebSocket) ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name signal.link.akoroglu.com.tr;

    ssl_certificate     /etc/letsencrypt/live/link.akoroglu.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.akoroglu.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass             http://127.0.0.1:4010;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}

# ── Mediasoup (HTTP signaling only — RTP goes directly over UDP) ─────────────
server {
    listen 443 ssl;
    server_name media.link.akoroglu.com.tr;

    ssl_certificate     /etc/letsencrypt/live/link.akoroglu.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.akoroglu.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

